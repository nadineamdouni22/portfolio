<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nadine Amdouni Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portfolio of Nadine Amdouni, junior embedded systems and hardware/firmware integration specialist: PCB design, ATmega328P, ESP32, LoRa, IoT.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bar with FR/EN and theme toggles; home = hero with real boards, recruiter answers, about, skills, featured AquaLink, project grid, experience, education, contact. Project pages = case study + sticky contribution panel. Light by default, softer navy dark on request. */
:root {
  --bg: #f3f6fb;
  --s1: #ffffff;
  --s2: #e6edf7;
  --line: #d9e1ed;
  --line2: #b7c5da;
  --ink: #12223d;
  --soft: #2c3e5c;
  --muted: #52637e;
  --accent: #1f5fd6;
  --accent-ink: #ffffff;
  --gold: #9a5f0c;
  --imgbg: #ffffff;
  --f-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #17243a; --s1: #1f2f4a; --s2: #2a3d5d; --line: #34496c; --line2: #4a6590;
  --ink: #ecf1fa; --soft: #cbd7ea; --muted: #a5b6d0; --accent: #6eabff; --accent-ink: #0b1a33; --gold: #e6b762;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; z-index: 40; }
.skip:focus { left: 8px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -.015em; text-wrap: balance; margin: 0; }
p { margin: 0 0 14px; max-width: 68ch; }

/* bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 20px; min-height: 58px; flex-wrap: wrap; }
.brand { font-family: var(--f-mono); font-weight: 500; font-size: 14px; text-decoration: none; margin-right: auto; padding-block: 8px; }
.brand b { color: var(--accent); font-weight: 500; }
.nav { display: flex; gap: 20px; font-family: var(--f-mono); font-size: 13px; }
.nav a { text-decoration: none; color: var(--muted); padding-block: 8px; }
.nav a:hover { color: var(--accent); }
.ctl { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; background: var(--s1); }
.seg button, .tbtn { font: 500 12px/1 var(--f-mono); background: transparent; color: var(--muted); border: 0; padding: 9px 11px; cursor: pointer; letter-spacing: .04em; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tbtn { border: 1px solid var(--line2); border-radius: 4px; background: var(--s1); }
.seg button:hover:not([aria-pressed="true"]), .tbtn:hover { color: var(--accent); }
@media (max-width: 820px) { .bar .wrap { gap: 0 16px; } .nav { order: 3; width: 100%; overflow-x: auto; gap: 18px; white-space: nowrap; } }

/* buttons, chips */
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { font: 500 14px/1 var(--f-mono); text-decoration: none; padding: 14px 18px; border: 1px solid var(--line2); border-radius: 3px; color: var(--ink); background: var(--s1); display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.1); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.chips li { font: 400 12.5px var(--f-mono); border: 1px solid var(--line2); padding: 5px 10px; border-radius: 3px; color: var(--ink); background: var(--s1); }
.chips.dim li { color: var(--muted); }
.eyebrow { font: 500 12.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
.pill { font: 500 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line2); padding: 2px 7px; border-radius: 3px; color: var(--muted); white-space: nowrap; }
.pill.real { border-color: var(--accent); color: var(--accent); }

/* hero */
.hero { padding-block: 52px 68px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 52px; align-items: center; }
.hero h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1; font-weight: 700; margin-bottom: 14px; }
.hero .role { font: 500 15px/1.5 var(--f-mono); color: var(--accent); margin: 0 0 22px; }
.hero .lede { font-size: 1.12rem; color: var(--soft); margin-bottom: 28px; }
.hero .chips { margin-top: 28px; }
.collage { border: 1px solid var(--line2); background: var(--s1); border-radius: 8px; padding: 14px; }
.collage .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.collage img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: var(--imgbg); border-radius: 4px; display: block; }
.collage .cap { font: 400 12px var(--f-mono); color: var(--muted); padding-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
@media (max-width: 880px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 32px; } .hero { padding-block: 32px 44px; } }

/* sections */
.sec { padding-block: 72px; border-top: 1px solid var(--line); }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 32px; margin-bottom: 32px; }
.sec h2 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); line-height: 1.1; }
.sec-head p { color: var(--muted); margin: 0; max-width: 46ch; }
@media (max-width: 720px) { .sec { padding-block: 52px; } }

/* at a glance */
.qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.qa > div { padding: 22px; background: var(--s1); }
.qa .q { font: 500 12.5px var(--f-mono); color: var(--accent); margin-bottom: 8px; }
.qa p { margin: 0; font-size: 15.5px; color: var(--soft); }
.qa a { font: 400 12.5px var(--f-mono); color: var(--muted); text-decoration: none; display: inline-block; margin-top: 10px; }
.qa a:hover { color: var(--accent); }
@media (max-width: 900px) { .qa { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 560px) { .qa { grid-template-columns: minmax(0, 1fr); } }

/* about */
.about { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 48px; }
.fact { padding: 16px 0; border-top: 1px solid var(--line); }
.fact b { display: block; font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
@media (max-width: 820px) { .about { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

/* skills */
.skillgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.skillcard { border: 1px solid var(--line); background: var(--s1); border-radius: 6px; padding: 22px; }
.skillcard h3 { font: 500 13px var(--f-mono); color: var(--accent); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 12px; }
.skillrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15.5px; }
.dots { display: inline-flex; gap: 4px; flex: none; }
.dots i { width: 14px; height: 14px; border-radius: 2px; border: 1px solid var(--line2); display: block; }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 22px; font: 400 12.5px var(--f-mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 14px; height: 14px; border-radius: 2px; background: var(--accent); display: inline-block; }
.legend i.o { background: transparent; border: 1px solid var(--line2); }
.legend em { font-style: normal; color: var(--ink); }

/* project cards */
.feature { display: grid; gap: 28px; border: 1px solid var(--line2); background: var(--s1); border-radius: 8px; padding: 32px; margin-bottom: 24px; }
.feature .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; }
.feature h3 { font-size: clamp(1.8rem, 3.4vw, 2.6rem); line-height: 1.05; margin-bottom: 10px; }
.tagline { color: var(--soft); font-size: 1.05rem; }
.stats { display: flex; flex-wrap: wrap; gap: 14px 36px; padding: 18px 0; margin: 18px 0; border-block: 1px dashed var(--line2); }
.stats div { display: flex; flex-direction: column; }
.stats strong { font: 500 1.6rem var(--f-mono); color: var(--accent); line-height: 1.2; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--muted); }
.stats.sm strong { font-size: 1.3rem; }
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: center; }
.strip figure { margin: 0; }
.strip img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: var(--imgbg); border: 1px solid var(--line); border-radius: 4px; display: block; }
.strip figcaption { font: 400 11.5px var(--f-mono); color: var(--muted); margin-top: 6px; }
.strip .note { grid-column: 1 / -1; font: 400 12px var(--f-mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
@media (max-width: 860px) { .feature .top { grid-template-columns: minmax(0, 1fr); gap: 20px; } .feature { padding: 20px; } }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
.card { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--s1); border-radius: 6px; text-decoration: none; overflow: hidden; transition: border-color .15s; }
.card:hover { border-color: var(--accent); }
.card .thumb { background: var(--s2); border-bottom: 1px solid var(--line); position: relative; }
.card .thumb svg { display: block; width: 100%; height: auto; }
.card .thumb img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.card .thumb .pill { position: absolute; left: 10px; top: 10px; background: var(--s1); }
.card .body { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card h3 { font-size: 1.3rem; }
.card p { color: var(--muted); font-size: 15.5px; margin: 0; }
.card .ctx { font: 400 12px var(--f-mono); color: var(--accent); }
.card .more { margin-top: auto; font: 500 13px var(--f-mono); color: var(--accent); }
.g-frame { fill: none; stroke: var(--line2); }
.g-box { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.g-fill { fill: var(--s1); stroke: var(--line2); }
.g-ink { fill: var(--ink); }
.g-line { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.t2g { font: 400 11px var(--f-mono); fill: var(--muted); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 20px; padding: 22px 0; border-top: 1px solid var(--line); }
.tl time { font: 500 13px var(--f-mono); color: var(--accent); padding-top: 4px; }
.tl h3 { font-size: 1.15rem; margin-bottom: 2px; }
.tl .org { color: var(--muted); font-size: 15.5px; margin: 0 0 6px; }
.tl p { color: var(--soft); font-size: 15.5px; }
a.lnk { font: 400 12.5px var(--f-mono); color: var(--accent); text-decoration: none; }
a.lnk:hover { text-decoration: underline; }
@media (max-width: 560px) { .tl li { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

/* contact */
.contact { display: grid; grid-template-columns: 120px minmax(0, 1fr); max-width: 620px; }
.contact dt, .contact dd { margin: 0; padding: 14px 0; border-top: 1px solid var(--line); }
.contact dt { font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 17px; }
.contact dd { overflow-wrap: anywhere; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.contact .empty { color: var(--muted); font-style: italic; }
.copy { font: 500 11.5px var(--f-mono); border: 1px solid var(--line2); background: var(--s1); color: var(--muted); border-radius: 3px; padding: 5px 9px; cursor: pointer; }
.copy:hover { color: var(--accent); border-color: var(--accent); }
footer { border-top: 1px solid var(--line); padding-block: 28px 44px; font: 400 12.5px var(--f-mono); color: var(--muted); }

/* project pages */
.crumb { font: 400 13px var(--f-mono); color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 28px; }
.crumb:hover { color: var(--accent); }
.phead { padding-block: 40px 40px; }
.phead h1 { font-size: clamp(2.2rem, 5.2vw, 3.8rem); line-height: 1.02; margin-bottom: 14px; }
.phead .sub { font-size: 1.15rem; color: var(--soft); max-width: 62ch; margin-bottom: 20px; }
.pbody { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 56px; align-items: start; padding-bottom: 40px; }
.panel { position: sticky; top: 84px; border: 1px solid var(--line2); background: var(--s1); border-radius: 6px; padding: 22px; }
.panel h2 { font: 500 12.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.panel ul { margin: 0; padding: 0; list-style: none; }
.panel li { padding: 9px 0 9px 18px; border-top: 1px solid var(--line); font-size: 15px; position: relative; }
.panel li::before { content: ""; position: absolute; left: 0; top: 18px; width: 8px; height: 2px; background: var(--accent); }
.panel .none { color: var(--muted); font-style: italic; }
.panel .ctxl { margin: 16px 0 0; font: 400 12px var(--f-mono); color: var(--muted); }
.ps { padding-block: 36px; border-top: 1px solid var(--line); }
.ps h2 { font-size: 1.7rem; margin-bottom: 18px; }
.ps h2.sm { margin-top: 26px; font-size: 1.25rem; }
.ps ul.list { margin: 0 0 14px; padding-left: 20px; max-width: 68ch; }
.ps ul.list li { margin-bottom: 8px; }
@media (max-width: 900px) { .pbody { grid-template-columns: minmax(0, 1fr); gap: 28px; } .panel { position: static; order: -1; } }

/* diagrams */
.fig { margin: 0 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--s1); }
.fig .scroll { overflow-x: auto; padding: 20px; }
.fig svg { display: block; width: 100%; height: auto; }
.fig figcaption { font: 400 12.5px var(--f-mono); color: var(--muted); padding: 12px 20px; border-top: 1px dashed var(--line2); display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.gb { fill: none; stroke: var(--line2); stroke-dasharray: 5 5; stroke-width: 1.2; }
.gl { font: 500 11px var(--f-mono); fill: var(--accent); letter-spacing: .08em; }
.node { fill: var(--bg); stroke: var(--line2); stroke-width: 1.4; }
.node.core { stroke: var(--accent); stroke-width: 2; }
.t1 { font: 500 13px var(--f-mono); fill: var(--ink); }
.t2 { font: 400 11px var(--f-mono); fill: var(--muted); }
.tag { font: 500 10.5px var(--f-mono); fill: var(--gold); letter-spacing: .04em; }
.wire { stroke: var(--gold); stroke-width: 1.6; fill: none; }
.wire.live { stroke: var(--accent); stroke-dasharray: 6 5; animation: flow 1.4s linear infinite; }
.arrow { fill: var(--gold); }
.life { stroke: var(--line2); stroke-dasharray: 4 5; stroke-width: 1.2; }
@keyframes flow { to { stroke-dashoffset: -22; } }
@media (prefers-reduced-motion: reduce) { .wire.live { animation: none; } html { scroll-behavior: auto; } }

/* workflow, boards, gallery */
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; counter-reset: st; }
.flow > div { padding: 18px; background: var(--s1); counter-increment: st; }
.flow > div::before { content: counter(st); font: 500 12px var(--f-mono); color: var(--accent); display: block; margin-bottom: 8px; }
.flow h3 { font-size: 1.05rem; margin-bottom: 6px; }
.flow p { font-size: 14.5px; color: var(--muted); margin: 0 0 8px; }
.flow .tool { font: 400 11.5px var(--f-mono); color: var(--gold); }
@media (max-width: 900px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.boards { display: grid; gap: 20px; }
.bcard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 28px; border: 1px solid var(--line); background: var(--s1); border-radius: 6px; padding: 24px; }
.bcard h3 { font-size: 1.3rem; margin-bottom: 4px; }
.bcard .n { font: 500 12px var(--f-mono); color: var(--accent); letter-spacing: .08em; }
.bcard .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-content: start; }
@media (max-width: 860px) { .bcard { grid-template-columns: minmax(0, 1fr); } }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; align-items: start; }
.ph { margin: 0; min-width: 0; }
.ph img { width: 100%; display: block; background: var(--imgbg); border: 1px solid var(--line); border-radius: 4px; aspect-ratio: 4 / 3; object-fit: contain; }
.ph.tall img { aspect-ratio: auto; object-fit: initial; }
.ph.sq img { aspect-ratio: 1 / 1; }
.ph figcaption { font: 400 12.5px var(--f-mono); color: var(--muted); margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.ph .frame { aspect-ratio: 4 / 3; max-width: 100%; border: 1px dashed var(--line2); border-radius: 4px; display: grid; place-items: center; text-align: center; padding: 12px; background-color: var(--s2); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.ph .frame > div { background: var(--s2); padding: 8px 12px; border-radius: 3px; }
.ph .frame b { display: block; font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.ph .frame span { font: 400 12px var(--f-mono); color: var(--muted); }
.todo { border: 1px dashed var(--line2); border-radius: 4px; padding: 16px 18px; color: var(--muted); font: 400 13px var(--f-mono); max-width: 68ch; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--s1); }
table.cmp { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 520px; }
table.cmp th, table.cmp td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.cmp th { font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--s2); }
table.cmp tr:last-child td { border-bottom: 0; }
table.cmp td:first-child { font: 500 13.5px var(--f-mono); color: var(--ink); white-space: nowrap; }
.bars { display: grid; gap: 14px; max-width: 520px; margin-bottom: 8px; }
.bar-row { display: grid; grid-template-columns: 90px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font: 400 13px var(--f-mono); }
.bar-row .track { height: 10px; background: var(--s2); border-radius: 2px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--accent); }
.bar-row b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.next { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 36px 56px; border-top: 1px solid var(--line); }
.note { font: 400 12.5px var(--f-mono); color: var(--muted); max-width: 68ch; }
</style>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Home">nadine<b>.</b>amdouni</a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="ctl">

  '<section class="sec" id="skills"><div class="wrap"><div class="sec-head"><h2>' + L('Technical skills', 'Compétences techniques') + '</h2><p>' + L('Each skill shows the projects where I used it.', "Chaque compétence indique les projets où je l'ai utilisée.") + '</p></div><div class="skillgrid">' + sk + '</div>' +
  '<div class="legend">' + dotLabels().map(function (l) { return '<span><i></i>' + l + '</span>'; }).join('') + '<span><i class="o"></i><em>' + L('Hollow: in my toolkit, not in a listed project yet', 'Vide : dans ma boîte à outils, pas encore dans un projet listé') + '</em></span></div></div></section>' +

  '<section class="sec" id="projects"><div class="wrap"><div class="sec-head"><h2>' + L('Projects', 'Projets') + '</h2><p>' + L('Four projects, from a three-board hardware system to IoT, AI and FPGA work.', "Quatre projets, d'un système matériel à trois cartes à l'IoT, l'IA et le FPGA.") + '</p></div>' +
  '<article class="feature" id="boards"><div class="top"><div><p class="eyebrow">' + a.num + '</p><h3>' + a.title + '</h3><p class="tagline">' + a.sub + '</p>' + stats(a.stats, true) + '<p>' + a.short + L(' My part: architecture, schematics, component selection, PCB design in Altium Designer, power calculations, and assembly and testing.', " Ma part : architecture, schémas, choix des composants, conception PCB sous Altium Designer, calculs énergétiques, assemblage et tests.") + '</p>' + chips(a.tech.slice(0, 6), true) + '<p></p><div class="btns"><a class="btn pri" href="#aqualink">' + L('Open case study', "Ouvrir l'étude de cas") + '</a></div></div>' + strip + '</div></article>' +
  '<div class="grid3">' + cards + '</div></div></section>' +

  '<section class="sec" id="experience"><div class="wrap"><div class="sec-head"><h2>' + L('Experience', 'Expérience') + '</h2></div>' + timeline(experience()) + '</div></section>' +
  '<section class="sec" id="education"><div class="wrap"><div class="sec-head"><h2>' + L('Education', 'Formation') + '</h2></div>' + timeline(education()) + '</div></section>' +

  '<section class="sec" id="contact"><div class="wrap"><div class="sec-head"><h2>Contact</h2><p>' + L('Open to junior PCB design, embedded hardware and hardware/firmware integration roles.', "Ouverte aux postes juniors en conception PCB, matériel embarqué et intégration matériel/firmware.") + '</p></div><dl class="contact">' +
  contactRow('Email', SITE.email, 'mail') + contactRow('LinkedIn', SITE.linkedin) + contactRow('GitHub', SITE.github) + '<dt>' + L('Location', 'Localisation') + '</dt><dd>' + L('Tunisia', 'Tunisie') + '</dd></dl></div></section>';
}

function renderProject(id) {
  var p = P[id], i = PROJ.indexOf(id), nid = PROJ[(i + 1) % PROJ.length], nx = P[nid];
  var diags = diagramsFor(p.diagrams).map(function (d) { return '<section class="ps"><h2>' + d[0] + '</h2>' + d[1] + '</section>'; }).join('');
  var boards = p.boards ? '<section class="ps"><h2>' + L('The three boards', 'Les trois cartes') + '</h2><div class="boards">' + p.boards.map(function (b) {
    return '<article class="bcard"><div><div class="n">' + b.n.toUpperCase() + '</div><h3>' + b.t + '</h3><p>' + b.d + '</p>' + chips(b.chips, true) + '</div><div class="pair">' + b.imgs.map(function (m) { return IMG(m[0], m[1], m[2], 'sq'); }).join('') + '</div></article>';
  }).join('') + '</div></section>' : '';
  var flow = '<section class="ps"><h2>' + (p.boards ? L('Development workflow', 'Méthode de développement') : L('Workflow', 'Chaîne de traitement')) + '</h2><div class="flow">' + p.flow.map(function (f) { return '<div><h3>' + f[0] + '</h3><p>' + f[1] + '</p>' + (f[2] ? '<span class="tool">' + f[2] + '</span>' : '') + '</div>'; }).join('') + '</div></section>';
  var cmp = '';
  if (id === 'locust') {
    cmp = '<section class="ps"><h2>' + L('Model comparison', 'Comparaison des modèles') + '</h2><div class="tablewrap"><table class="cmp"><thead><tr><th>' + L('Model', 'Modèle') + '</th><th>' + L('Task', 'Tâche') + '</th><th>' + L('Role in the project', 'Rôle dans le projet') + '</th></tr></thead><tbody>' +
      '<tr><td>YOLOv8s</td><td>' + L('Detection', 'Détection') + '</td><td>' + L('Finds each insect and draws its bounding box. Reached about 95 % mAP@0.5 and 87 % recall.', "Localise chaque insecte et trace sa boîte englobante. Environ 95 % de mAP@0.5 et 87 % de rappel.") + '</td></tr>' +
      '<tr><td>MobileNetV2</td><td>Classification</td><td>' + L('Lightweight CNN backbone evaluated as a classifier.', 'Réseau CNN léger évalué comme classifieur.') + '</td></tr>' +
      '<tr><td>EfficientNetB0</td><td>Classification</td><td>' + L('Compared against MobileNetV2 on the same data.', 'Comparé à MobileNetV2 sur les mêmes données.') + '</td></tr>' +
      '<tr><td>' + L('Custom CNN', 'CNN personnalisé') + '</td><td>Classification</td><td>' + L('Baseline network designed for this task.', 'Réseau de référence conçu pour cette tâche.') + '</td></tr></tbody></table></div><p class="note" style="margin-top:12px">' + L('Detection figures are approximate and come from the tested setup.', "Les chiffres de détection sont approximatifs et issus de l'environnement testé.") + '</p></section>';
  }
  var bars = id === 'locust' ? '<div class="bars"><div class="bar-row"><span>mAP@0.5</span><div class="track"><div class="fill" style="width:95%"></div></div><b>≈ 95%</b></div><div class="bar-row"><span>' + L('Recall', 'Rappel') + '</span><div class="track"><div class="fill" style="width:87%"></div></div><b>≈ 87%</b></div></div>' : '';
  var chall = '<section class="ps"><h2>' + L('Challenges and design decisions', 'Défis et choix de conception') + '</h2>' + (p.challenges ? '<ul class="list">' + p.challenges.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>' : todo(L('the main technical challenges you solved and how', 'les principaux défis techniques rencontrés et comment vous les avez résolus'))) + '</section>';
  var results = '<section class="ps"><h2>' + L('Results', 'Résultats') + '</h2>' + (p.stats ? stats(p.stats) : '') + bars + (p.results ? '<ul class="list">' + p.results.map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul>' : todo(L('measured results of this project', 'les résultats mesurés de ce projet'))) + (p.link ? '<p><a class="btn" href="' + p.link[0] + '" target="_blank" rel="noopener">' + p.link[1] + '</a></p>' : '') + '</section>';
  var gal = '';
  if (p.images) gal += '<section class="ps"><h2>' + L('Gallery', 'Galerie') + '</h2><div class="gallery">' + p.images.map(function (m) { return IMG(m[0], m[1], m[2], m[3]); }).join('') + '</div></section>';
  if (p.docs) gal += '<section class="ps"><h2>' + (id === 'aqualink' ? L('Design documents', 'Documents de conception') : L('Gallery', 'Galerie')) + '</h2><div class="gallery">' + p.docs.map(function (g) { return PH(g[0], g[1]); }).join('') + '</div></section>';

  $('#app').innerHTML =
  '<div class="wrap"><section class="phead" id="top"><a class="crumb" href="#projects">← ' + L('All projects', 'Tous les projets') + '</a><p class="eyebrow">' + p.num + '</p><h1>' + p.title + '</h1><p class="sub">' + p.sub + '</p>' + chips(p.tech) + '</section>' +
  '<div class="pbody"><div><section class="ps" style="border-top:0;padding-top:0"><h2>' + L('Overview', 'Présentation') + '</h2>' + p.overview.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '<h2 class="sm">' + L('Objectives', 'Objectifs') + '</h2><ul class="list">' + p.objectives.map(function (o) { return '<li>' + o + '</li>'; }).join('') + '</ul></section>' + diags + boards + flow + cmp + chall + results + gal + '</div>' +
  '<aside class="panel" aria-label="' + L('My contribution', 'Ma contribution') + '"><h2>' + L('My contribution', 'Ma contribution') + '</h2>' + (p.contribution ? '<ul>' + p.contribution.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>' : '<div class="none">' + L('To add: what you designed, built and tested in this project.', 'À ajouter : ce que vous avez conçu, réalisé et testé dans ce projet.') + '</div>') + '<p class="ctxl">' + p.ctx + '</p></aside></div>' +
  '<div class="next"><a class="btn" href="#projects">← ' + L('All projects', 'Tous les projets') + '</a><a class="btn pri" href="#' + nid + '">' + L('Next: ', 'Suivant : ') + nx.title + ' →</a></div></div>';
}

/* ================= shell, router, toggles ================= */
function shell() {
  $('#nav').innerHTML = navHtml();
  $('#skip').textContent = L('Skip to content', 'Aller au contenu');
  $('#foot').innerHTML = '© 2026 Nadine Amdouni · ' + L('Tunisia', 'Tunisie');
  $('#btn-fr').setAttribute('aria-pressed', String(LANG === 'fr'));
  $('#btn-en').setAttribute('aria-pressed', String(LANG === 'en'));
  document.documentElement.lang = LANG;
  document.title = 'Nadine Amdouni · Portfolio';
}
function draw() {
  P = projects(); shell();
  if (view !== 'home' && P[view]) renderProject(view); else renderHome();
}
function route() {
  var h = (location.hash || '').slice(1);
  var prev = view;
  P = projects();
  if (P[h]) { view = h; draw(); window.scrollTo(0, 0); return; }
  view = 'home';
  if (prev !== 'home' || !$('#app').innerHTML) draw();
  var el = h && document.getElementById(h);
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}
function setLang(l) { LANG = l; try { localStorage.setItem('pf-lang', l); } catch (e) {} draw(); }
function setTheme(t) {
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('pf-theme', t); } catch (e) {}
  $('#btn-theme').setAttribute('aria-pressed', String(t === 'dark'));
}
$('#btn-fr').addEventListener('click', function () { setLang('fr'); });
$('#btn-en').addEventListener('click', function () { setLang('en'); });
$('#btn-theme').addEventListener('click', function () { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-copy]');
  if (!b) return;
  var v = b.getAttribute('data-copy');
  function ok() { b.textContent = L('Copied', 'Copié'); setTimeout(function () { b.textContent = L('Copy', 'Copier'); }, 1500); }
  try { navigator.clipboard.writeText(v).then(ok, function () { window.getSelection().selectAllChildren(b.previousElementSibling); }); } catch (err) { window.getSelection().selectAllChildren(b.previousElementSibling); }
});
window.addEventListener('hashchange', route);
(function () {
  var l = null, t = null;
  try { l = localStorage.getItem('pf-lang'); t = localStorage.getItem('pf-theme'); } catch (e) {}
  LANG = l || ((navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
  setTheme(t === 'dark' ? 'dark' : 'light');
  route();
})();
</script>
